name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fastapi
      VERSION: ${{ github.ref_name }}

    steps:

      # -----------------------------------------
      # Checkout
      # -----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------
      # Docker Hub login
      # -----------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------------
      # Build Docker image
      # -----------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            ./app

      # -----------------------------------------
      # Trivy full vulnerability scan
      # -----------------------------------------
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 0

      # -----------------------------------------
      # Generate human-readable report
      # -----------------------------------------
      - name: Generate Trivy table report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          output: trivy-report.txt
          severity: CRITICAL
          exit-code: 0

      # -----------------------------------------
      # Add report to Actions summary
      # -----------------------------------------
      - name: Add Trivy report to build summary
        if: always()
        run: |
          echo "## 🔍 Trivy Security Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------
      # Upload Trivy report
      # -----------------------------------------
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-results.sarif
            trivy-report.txt
          retention-days: 30

      # -----------------------------------------
      # Security gate
      # -----------------------------------------
      - name: Check CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: false

      # -----------------------------------------
      # Push release image
      # -----------------------------------------
      - name: Push Docker image
        if: success()
        run: |
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${GITHUB_SHA}"