name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fastapi

    steps:
      # -----------------------------------------
      # Checkout
      # -----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------
      # Docker Hub login
      # -----------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------------
      # Build Docker image locally
      # -----------------------------------------
      - name: Build Docker image
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"

            docker build \
              -t "${IMAGE}:${VERSION}" \
              -t "${IMAGE}:${GITHUB_SHA}" \
              -t "${IMAGE}:latest" \
              ./app
          else
            docker build \
              -t "${IMAGE}:${GITHUB_SHA}" \
              -t "${IMAGE}:latest" \
              ./app
          fi

      # -----------------------------------------
      # Trivy full vulnerability scan
      # -----------------------------------------
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          exit-code: 0

      # -----------------------------------------
      # Generate human-readable Trivy report
      # -----------------------------------------
      - name: Generate Trivy table report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          output: trivy-report.txt
          severity: CRITICAL
          exit-code: 0

      # -----------------------------------------
      # Add Trivy report to Actions summary
      # -----------------------------------------
      - name: Add Trivy report to build summary
        if: always()
        run: |
          echo "## 🔍 Trivy Security Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------
      # Upload Trivy reports as artifacts
      # -----------------------------------------
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-results.sarif
            trivy-report.txt
          retention-days: 30

      # -----------------------------------------
      # Security gate
      # HIGH / CRITICAL = fail
      # -----------------------------------------
      - name: Check CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: false

      # -----------------------------------------
      # Push exact image that was scanned
      # -----------------------------------------
      - name: Push Docker image
        if: success()
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"

            docker push "${IMAGE}:${VERSION}"
            docker push "${IMAGE}:${GITHUB_SHA}"
            docker push "${IMAGE}:latest"
          else
            docker push "${IMAGE}:${GITHUB_SHA}"
            docker push "${IMAGE}:latest"
          fi