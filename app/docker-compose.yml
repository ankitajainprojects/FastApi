services:
  api:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    networks:
      - backend

  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgresuser
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bookdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data: