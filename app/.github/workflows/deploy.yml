
name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  security-events: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Docker Hub Login
      # ----------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------
      # Build Docker Image
      # ----------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi:${{ github.sha }}

      # ----------------------------------------
      # Trivy - Generate Full SARIF Report
      # ----------------------------------------
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKERHUB_USERNAME }}/fastapi:${{ github.sha }}"
          format: sarif
          output: trivy-results.sarif
          exit-code: 0

      # ----------------------------------------
      # Upload Trivy Results to GitHub Security
      # ----------------------------------------
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # ----------------------------------------
      # Upload SARIF as GitHub Actions Artifact
      # ----------------------------------------
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-results.sarif

      # ----------------------------------------
      # Security Gate
      # HIGH + CRITICAL = FAIL
      # ----------------------------------------
      - name: Check HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKERHUB_USERNAME }}/fastapi:${{ github.sha }}"
          format: table
          severity: "HIGH,CRITICAL"
          exit-code: 1

      # ----------------------------------------
      # Push Docker Image
      # Only runs if Trivy security check passes
      # ----------------------------------------
      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi:${{ github.sha }}
